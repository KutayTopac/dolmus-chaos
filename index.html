<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Dolmuş Chaos</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b2c;color:#f4ebdd;font-family:system-ui,sans-serif}
    #game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#171b2c}
    #loading{position:fixed;inset:0;display:grid;place-items:center;font-weight:700;letter-spacing:.08em}
  </style>
</head>
<body>
  <div id="loading">GÜNCEL SÜRÜM YÜKLENİYOR…</div>
  <iframe id="game" title="Dolmuş Chaos" allow="autoplay; fullscreen" hidden></iframe>
  <script>
    fetch('version.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('version');return r.text();})
      .then(function(v){var f=document.getElementById('game');f.src='game.html?v='+encodeURIComponent(v.trim());f.hidden=false;document.getElementById('loading').remove();})
      .catch(function(){var f=document.getElementById('game');f.src='game.html?v='+Date.now();f.hidden=false;document.getElementById('loading').remove();});
  </script>
</body>
</html>
